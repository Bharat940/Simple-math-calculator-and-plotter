name: Build, Test & Release

on:
  push:
    branches: [ main, master, v0.2.0-ast-rewrite ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsdl2-dev libsdl2-ttf-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests (132 tests + 9 AST tests)
        run: |
          ./build/tests
          ./build/test_ast

      - name: Run benchmarks
        run: |
          ./build/benchmarks
          ./build/bench_v0.2.0

      - name: Prepare artifact
        run: cp build/mathstudio mathstudio-linux

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: mathstudio-linux-x64
          path: mathstudio-linux

      - name: Release Linux Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: mathstudio-linux
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS (Clang)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sdl2 sdl2_ttf

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2);$(brew --prefix sdl2_ttf)"

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests (132 tests + 9 AST tests)
        run: |
          ./build/tests
          ./build/test_ast

      - name: Run benchmarks
        run: |
          ./build/benchmarks
          ./build/bench_v0.2.0

      - name: Prepare artifact
        run: cp build/mathstudio mathstudio-macos

      - name: Upload macOS Binaries
        uses: actions/upload-artifact@v4
        with:
          name: mathstudio-macos-arm64
          path: mathstudio-macos

      - name: Release macOS Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: mathstudio-macos
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: vcpkg install sdl2 sdl2-ttf --triplet x64-windows
        env:
          VCPKG_BINARY_SOURCES: "clear"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests (132 tests + 9 AST tests)
        run: |
          .\build\Release\tests.exe
          .\build\Release\test_ast.exe

      - name: Run benchmarks
        run: |
          .\build\Release\benchmarks.exe
          .\build\Release\bench_v0.2.0.exe

      - name: Prepare artifact
        run: Copy-Item build\Release\mathstudio.exe mathstudio-windows.exe

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: mathstudio-windows-x64
          path: mathstudio-windows.exe

      - name: Release Windows Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: mathstudio-windows.exe
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
