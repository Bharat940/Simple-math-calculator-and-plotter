name: Build, Test & Release

on:
  push:
    branches: [ main, master, v0.2.0-ast-rewrite, v0.3.0-imgui-ui ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsdl2-dev libsdl2-ttf-dev valgrind

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests (137 tests + 9 AST tests)
        run: |
          ./build/tests
          ./build/test_ast

      - name: Run Valgrind dynamic memory leak audit
        run: |
          valgrind --leak-check=full --show-leak-kinds=definite,indirect --errors-for-leak-kinds=definite,indirect --error-exitcode=1 ./build/tests
          valgrind --leak-check=full --show-leak-kinds=definite,indirect --errors-for-leak-kinds=definite,indirect --error-exitcode=1 ./build/test_ast

      - name: Run benchmarks & CLI leak check
        run: |
          ./build/benchmarks
          ./build/bench_v0.2.0
          ./build/bench_v0.3.0
          ./build/mathstudio -e "a*sin(b*x)" --var a=2.5 --var b=1.5 --check-leaks
          ./build/mathstudio -s "x^2 - 4" --check-leaks
          ./build/mathstudio -i "x^2" "2*x + 1"
          ./build/mathstudio -d "sin(x)"

      - name: Prepare artifact
        run: cp build/mathstudio mathstudio-linux

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: mathstudio-linux-x64
          path: mathstudio-linux

      - name: Release Linux Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: mathstudio-linux
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS (Clang)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sdl2 sdl2_ttf freetype

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix sdl2);$(brew --prefix sdl2_ttf);$(brew --prefix freetype)"

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests (137 tests + 9 AST tests)
        run: |
          ./build/tests
          ./build/test_ast

      - name: Run benchmarks & CLI leak check
        run: |
          ./build/benchmarks
          ./build/bench_v0.2.0
          ./build/bench_v0.3.0
          ./build/mathstudio -e "a*sin(b*x)" --var a=2.5 --var b=1.5 --check-leaks
          ./build/mathstudio -s "x^2 - 4" --check-leaks
          ./build/mathstudio -i "x^2" "2*x + 1"
          ./build/mathstudio -d "sin(x)"

      - name: Prepare artifact
        run: cp build/mathstudio mathstudio-macos

      - name: Upload macOS Binaries
        uses: actions/upload-artifact@v4
        with:
          name: mathstudio-macos-arm64
          path: mathstudio-macos

      - name: Release macOS Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: mathstudio-macos
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: vcpkg install sdl2 sdl2-ttf --triplet x64-windows-static

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests (137 tests + 9 AST tests)
        run: |
          .\build\Release\tests.exe
          .\build\Release\test_ast.exe

      - name: Run benchmarks & MSVC CRT memory leak check
        run: |
          .\build\Release\benchmarks.exe
          .\build\Release\bench_v0.2.0.exe
          .\build\Release\bench_v0.3.0.exe
          .\build\Release\mathstudio.exe -e "a*sin(b*x)" --var a=2.5 --var b=1.5 --check-leaks
          .\build\Release\mathstudio.exe -s "x^2 - 4" --check-leaks
          .\build\Release\mathstudio.exe -i "x^2" "2*x + 1"
          .\build\Release\mathstudio.exe -d "sin(x)"

      - name: Prepare artifact
        run: Copy-Item build\Release\mathstudio.exe mathstudio-windows.exe

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: mathstudio-windows-x64
          path: mathstudio-windows.exe

      - name: Release Windows Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: mathstudio-windows.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
